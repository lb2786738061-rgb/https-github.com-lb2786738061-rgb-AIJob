services:
  backend:
    build: ./backend
    ports:
      - "3002:3002"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=3002
      - DATABASE_URL=/app/data/careerai.db
      - UPLOAD_DIR=/app/uploads
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE=/api/v1

volumes:
  backend-data:
  backend-uploads:
